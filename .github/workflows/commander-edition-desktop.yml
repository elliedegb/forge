name: Commander Edition Desktop

# Builds the desktop installer (Windows and Linux; macOS runs the same package) of this fork and publishes it as the
# "commander-edition-desktop-latest" release. Upstream's "Create Desktop Snapshot" only runs for Card-Forge, which
# uploads to its own server; this is the fork's equivalent. Runs from the Actions tab or from sync-upstream.yml.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: commander-edition-desktop
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install virtual framebuffer
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Build the installer
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B clean -P windows-linux install -T 1C -Dmaven.test.skip=true

      - name: Collect the files
        run: |
          mkdir dist
          mv forge-installer/target/*.tar.bz2 dist/
          ls -la dist
          test -n "$(ls dist)"

      # The Commander edition uses the same interface on desktop as on Android (the duel table, the hand as a fan):
      # the forge launchers start it, and the old desktop interface stays available as forge-classic.
      - name: Make the Android interface the main launcher
        run: |
          for pkg in dist/*.tar.bz2; do
            rm -rf unpacked && mkdir unpacked
            tar -xjf "$pkg" -C unpacked
            dir="$(dirname "$(find unpacked -name 'forge-adventure.sh' | head -n 1)")"
            test -d "$dir"
            for ext in sh cmd exe command; do
              if [ -f "$dir/forge.$ext" ]; then mv "$dir/forge.$ext" "$dir/forge-classic.$ext"; fi
              if [ -f "$dir/forge-adventure.$ext" ]; then cp -p "$dir/forge-adventure.$ext" "$dir/forge.$ext"; fi
            done
            (cd unpacked && tar -cjf "../$pkg" .)
          done
          rm -rf unpacked
          ls -la dist

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: forge-commander-edition-desktop
          path: dist/*
          if-no-files-found: error

      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Forge Commander edition for desktop, built from $(git rev-parse --short HEAD) on $(date -u +%Y-%m-%d). Unpack the .tar.bz2 and run forge.exe (Windows) or forge.sh (Linux, macOS); forge-classic opens the old desktop interface. Needs Java 17."
          gh release delete commander-edition-desktop-latest --yes --cleanup-tag || true
          gh release create commander-edition-desktop-latest dist/* --title "Forge Commander edition for desktop (latest)" --notes "$notes" --target "$(git rev-parse HEAD)"
