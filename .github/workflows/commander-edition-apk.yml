name: Commander Edition APK

# Builds the Android APK of this fork (Commander edition on by default) and publishes it as the
# "commander-edition-latest" release. Runs from the Actions tab, or from sync-upstream.yml after new cards arrive.
# Based on test-android-build.yml.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: commander-edition-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # After sync-upstream.yml pushes a merge, build the branch tip rather than the commit that started the run
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Android tools
        run: |
          JAVA_HOME=${JAVA_HOME_17_X64} ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "build-tools;35.0.0" "platform-tools" "platforms;android-35"

      - name: Install Android maven plugin
        run: |
          mkdir -p ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          cd ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          curl -fL -o android-maven-plugin-4.6.2.jar https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.jar
          curl -fL -o android-maven-plugin-4.6.2.pom https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.pom
          cd -
          mvn -B install -Dmaven.test.skip=true

      - name: Install virtual framebuffer
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Build the APK
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B -P android-test-build verify -e -T 1C -Dandroid.sdk.path=$ANDROID_SDK_ROOT -Dandroid.buildToolsVersion=35.0.0 -Dmaven.test.skip=true

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-commander-edition-apk
          path: forge-gui-android/target/*.apk
          if-no-files-found: error

      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Forge Commander edition built from $(git rev-parse --short HEAD) on $(date -u +%Y-%m-%d). Includes every card Forge supported at that commit."
          gh release delete commander-edition-latest --yes --cleanup-tag || true
          gh release create commander-edition-latest forge-gui-android/target/*.apk --title "Forge Commander edition (latest)" --notes "$notes" --target "$(git rev-parse HEAD)"
